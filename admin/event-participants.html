<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>イベント参加者一覧 | Molkkynist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="../js/admin-event-participants.js"></script>
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <a class="brand" href="index.html" aria-label="管理ダッシュボード">
        <img class="brand__mark" src="../assets/images/logos/molkkynist-logo-mark.png" alt="" width="48" height="48">
        <span class="brand__name">Molkkynist Admin</span>
      </a>
      <nav class="admin-nav" aria-label="管理画面ナビゲーション">
        <a href="index.html">ダッシュボード</a>
        <a href="events.html">イベント管理</a>
        <a href="venues.html">開催場所</a>
        <a href="news.html">お知らせ管理</a>
        <a href="event-participants.html">イベント参加者一覧</a>
        <a href="contact-submissions.html">お問い合わせ管理</a>
        <button class="button button--secondary" type="button" data-admin-logout>ログアウト</button>
      </nav>
    </header>
    <main class="admin-shell">
      <section class="admin-heading" aria-labelledby="event-participants-title">
        <p class="section__label">Participants</p>
        <h1 id="event-participants-title">イベント参加者一覧</h1>
        <p>開催予定イベントごとに、参加希望フォームから届いた参加者情報を確認します。</p>
        <p class="form-status" data-admin-status hidden></p>
      </section>

      <section class="admin-layout admin-layout--participants" aria-label="イベント参加者管理エリア">
        <div class="admin-card">
          <h2>開催予定イベント</h2>
          <p>カードを選択すると、そのイベントの参加希望者を表示します。</p>
          <p class="schedule-events__status" data-admin-participants-events-status>開催予定イベントを読み込んでいます…</p>
          <ul class="venue-list admin-participant-event-list" data-admin-participant-events aria-label="開催予定イベント一覧"></ul>
        </div>
        <article class="admin-card admin-participant-detail" data-admin-participant-detail>
          <p class="admin-empty">左のイベントを選択してください。</p>
        </article>
      </section>
    </main>
  </body>
</html>
