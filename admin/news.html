<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>お知らせ管理 | Molkkynist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="../js/admin-news.js"></script>
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <a class="brand" href="index.html" aria-label="管理ダッシュボード">
        <img class="brand__mark" src="../assets/images/logos/molkkynist-logo-mark.png" alt="" width="48" height="48">
        <span class="brand__name">Molkkynist Admin</span>
      </a>
      <nav class="admin-nav" aria-label="管理画面ナビゲーション">
        <a href="index.html">ダッシュボード</a>
        <a href="events.html">イベント管理</a>
        <a href="venues.html">開催場所</a>
        <a href="event-participants.html">イベント参加者一覧</a>
        <a href="contact-submissions.html">お問い合わせ管理</a>
        <button class="button button--secondary" type="button" data-admin-logout>ログアウト</button>
      </nav>
    </header>
    <main class="admin-shell">
      <section class="admin-heading" aria-labelledby="news-admin-title">
        <p class="section__label">News</p>
        <h1 id="news-admin-title">お知らせ管理</h1>
        <p>公開状態をオンにしたお知らせは、トップページのお知らせカルーセルと詳細ページに表示されます。</p>
        <p class="form-status" data-admin-status hidden></p>
      </section>

      <section class="admin-layout" aria-label="お知らせ編集エリア">
        <form class="contact-form admin-form" data-admin-news-form>
          <div class="form-row">
            <label for="news-title">
              <span class="form-label">タイトル <span class="form-required">必須</span></span>
              <input id="news-title" name="title" type="text" required>
            </label>
            <label for="news-publish-date">
              <span class="form-label">配信日 <span class="form-required">必須</span></span>
              <input id="news-publish-date" name="publishDate" type="date" required>
            </label>
          </div>
          <label for="news-body">
            <span class="form-label">本文 <span class="form-required">必須</span></span>
            <textarea id="news-body" name="body" rows="9" required placeholder="段落を分ける場合は、空行を入れて入力してください。"></textarea>
          </label>
          <div class="admin-upload-field">
            <label for="news-image-file">
              <span class="form-label">カード画像をアップロード</span>
              <input id="news-image-file" name="imageFile" type="file" accept="image/jpeg,image/png,image/webp" data-admin-image-file>
            </label>
            <p class="form-help">JPEG / PNG / WebP、5MBまで。選択した画像は保存時に Cloud Storage for Firebase へアップロードします。</p>
            <div class="admin-image-preview" data-admin-image-preview hidden>
              <img src="" alt="選択中のお知らせ画像プレビュー" data-admin-image-preview-img>
              <button class="button button--secondary" type="button" data-admin-image-clear hidden>選択を解除</button>
            </div>
          </div>
          <div class="form-row">
            <label for="news-visual-variant">
              <span class="form-label">プレースホルダー色</span>
              <select id="news-visual-variant" name="visualVariant">
                <option value="">標準</option>
                <option value="soft">グリーン</option>
                <option value="wood">ウッド</option>
                <option value="lime">ライム</option>
              </select>
            </label>
            <label class="checkbox-line admin-checkbox">
              <input name="isPublished" type="checkbox">
              <span>公開する</span>
            </label>
          </div>
          <div class="form-actions admin-actions">
            <button class="button button--primary" type="submit">お知らせを保存</button>
            <button class="button button--secondary" type="button" data-admin-cancel-edit hidden>編集をキャンセル</button>
          </div>
        </form>

        <div class="admin-card">
          <h2>登録済みお知らせ</h2>
          <div class="admin-list" data-admin-news-list>
            <p class="admin-empty">お知らせを読み込んでいます。</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
