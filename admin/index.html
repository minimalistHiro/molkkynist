<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>管理ダッシュボード | Molkkynist</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module">
      import { initLogoutButtons, requireAdmin } from "../js/admin-auth.js";
      const statusEl = document.querySelector("[data-admin-status]");
      requireAdmin(statusEl).then((context) => {
        if (context) initLogoutButtons();
      });
    </script>
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <a class="brand" href="index.html" aria-label="管理ダッシュボード">
        <img class="brand__mark" src="../assets/images/logos/molkkynist-logo-mark.png" alt="" width="48" height="48">
        <span class="brand__name">Molkkynist Admin</span>
      </a>
      <nav class="admin-nav" aria-label="管理画面ナビゲーション">
        <a href="events.html">イベント管理</a>
        <a href="contact-submissions.html">お問い合わせ管理</a>
        <button class="button button--secondary" type="button" data-admin-logout>ログアウト</button>
      </nav>
    </header>
    <main class="admin-shell">
      <section class="admin-heading" aria-labelledby="dashboard-title">
        <p class="section__label">Dashboard</p>
        <h1 id="dashboard-title">管理ダッシュボード</h1>
        <p>イベント情報とお問い合わせ内容を確認・更新します。管理画面へのリンクは公開サイトには表示しません。</p>
        <p class="form-status" data-admin-status hidden></p>
      </section>
      <section class="admin-grid" aria-label="管理メニュー">
        <a class="admin-menu-card" href="events.html">
          <span class="status-chip">D-2</span>
          <h2>イベント管理</h2>
          <p>開催日、場所、参加費、公開状態を登録します。公開中のイベントはお問い合わせフォームの日程選択にも表示されます。</p>
        </a>
        <a class="admin-menu-card" href="contact-submissions.html">
          <span class="status-chip">D-4</span>
          <h2>お問い合わせ管理</h2>
          <p>フォーム送信内容を一覧・詳細で確認し、自動返信メールの送信状態を確認します。</p>
        </a>
      </section>
    </main>
  </body>
</html>
