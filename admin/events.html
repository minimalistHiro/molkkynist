<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>イベント管理 | Molkkynist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="../js/admin-events.js"></script>
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <a class="brand" href="index.html" aria-label="管理ダッシュボード">
        <img class="brand__mark" src="../assets/images/logos/molkkynist-logo-mark.png" alt="" width="48" height="48">
        <span class="brand__name">Molkkynist Admin</span>
      </a>
      <nav class="admin-nav" aria-label="管理画面ナビゲーション">
        <a href="index.html">ダッシュボード</a>
        <a href="venues.html">開催場所</a>
        <a href="news.html">お知らせ管理</a>
        <a href="contact-submissions.html">お問い合わせ管理</a>
        <button class="button button--secondary" type="button" data-admin-logout>ログアウト</button>
      </nav>
    </header>
    <main class="admin-shell">
      <section class="admin-heading" aria-labelledby="events-admin-title">
        <p class="section__label">Events</p>
        <h1 id="events-admin-title">イベント管理</h1>
        <p>開催予定のイベントは、公開サイトの開催スケジュールとお問い合わせフォームの日程候補として使われます。</p>
        <p class="form-status" data-admin-status hidden></p>
      </section>

      <section class="admin-layout" aria-label="イベント編集エリア">
        <form class="contact-form admin-form" data-admin-event-form>
          <div class="form-row">
            <label for="event-date">
              <span class="form-label">開催日 <span class="form-required">必須</span></span>
              <input id="event-date" name="eventDate" type="date" required>
            </label>
            <label for="event-start">
              <span class="form-label">開始時間</span>
              <input id="event-start" name="startTime" type="time">
            </label>
          </div>
          <div class="form-row">
            <label for="event-end">
              <span class="form-label">終了時間</span>
              <input id="event-end" name="endTime" type="time">
            </label>
            <label for="event-venue-id">
              <span class="form-label">開催場所 <span class="form-required">必須</span></span>
              <select id="event-venue-id" name="venueId" required data-admin-venue-select>
                <option value="">開催場所を読み込んでいます</option>
              </select>
            </label>
          </div>
          <div class="form-row">
            <label for="event-fee">
              <span class="form-label">参加費</span>
              <input id="event-fee" name="fee" type="text" placeholder="例: 500円">
            </label>
            <label for="event-rain-policy">
              <span class="form-label">雨天時の対応</span>
              <input id="event-rain-policy" name="rainPolicy" type="text" placeholder="例: 前日夜にInstagramで案内">
            </label>
          </div>
          <label for="event-status">
            <span class="form-label">状態</span>
            <select id="event-status" name="status">
              <option value="scheduled">開催予定</option>
              <option value="closed">受付終了</option>
              <option value="finished">開催済み</option>
              <option value="canceled">中止</option>
            </select>
          </label>
          <div class="form-actions admin-actions">
            <button class="button button--primary" type="submit">イベントを保存</button>
            <button class="button button--secondary" type="button" data-admin-cancel-edit hidden>編集をキャンセル</button>
          </div>
        </form>

        <div class="admin-card">
          <h2>登録済みイベント</h2>
          <div class="admin-list" data-admin-events-list>
            <p class="admin-empty">イベントを読み込んでいます。</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
