<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>メンバー管理 | Molkkynist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="../js/admin-members.js"></script>
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <a class="brand" href="index.html" aria-label="管理ダッシュボード">
        <img class="brand__mark" src="../assets/images/logos/molkkynist-logo-mark.png" alt="" width="48" height="48">
        <span class="brand__name">Molkkynist Admin</span>
      </a>
      <nav class="admin-nav" aria-label="管理画面ナビゲーション">
        <a href="index.html">ダッシュボード</a>
        <a href="events.html">イベント管理</a>
        <a href="venues.html">開催場所</a>
        <a href="news.html">お知らせ管理</a>
        <a href="contact-submissions.html">お問い合わせ管理</a>
        <button class="button button--secondary" type="button" data-admin-logout>ログアウト</button>
      </nav>
    </header>
    <main class="admin-shell">
      <section class="admin-heading" aria-labelledby="members-admin-title">
        <p class="section__label">Members</p>
        <h1 id="members-admin-title">メンバー管理</h1>
        <p>公開状態をオンにしたメンバーは、トップページのメンバー一覧と詳細ページに表示されます。写真未設定時はアイコン風プレースホルダーを表示します。</p>
        <p class="form-status" data-admin-status hidden></p>
      </section>

      <section class="admin-layout" aria-label="メンバー編集エリア">
        <form class="contact-form admin-form" data-admin-member-form>
          <div class="form-row">
            <label for="member-name">
              <span class="form-label">名前 <span class="form-required">必須</span></span>
              <input id="member-name" name="name" type="text" required>
            </label>
            <label for="member-role">
              <span class="form-label">役割 <span class="form-required">必須</span></span>
              <input id="member-role" name="role" type="text" required placeholder="例: 主催者">
            </label>
          </div>
          <label for="member-image-url">
            <span class="form-label">写真またはアイコン画像URL</span>
            <input id="member-image-url" name="imageUrl" type="text" placeholder="例: assets/images/members/ishii.jpg">
            <span class="form-help">既存画像URLを直接指定する場合に使います。スマホから写真を追加する場合は下のアップロード欄を使ってください。</span>
          </label>
          <div class="admin-upload-field">
            <label for="member-image-file">
              <span class="form-label">写真をアップロード</span>
              <input id="member-image-file" name="imageFile" type="file" accept="image/jpeg,image/png,image/webp" data-admin-member-image-file>
            </label>
            <p class="form-help">JPEG / PNG / WebP、5MBまで。選択した画像は保存時に Firebase Storage へアップロードします。</p>
            <div class="admin-image-preview" data-admin-member-image-preview hidden>
              <img src="" alt="選択中のメンバー写真プレビュー" data-admin-member-image-preview-img>
              <button class="button button--secondary" type="button" data-admin-member-image-clear>選択を解除</button>
            </div>
          </div>
          <div class="form-row">
            <label for="member-visual-variant">
              <span class="form-label">アイコン色</span>
              <select id="member-visual-variant" name="visualVariant">
                <option value="">標準</option>
                <option value="soft">グリーン</option>
                <option value="wood">ウッド</option>
              </select>
            </label>
            <label for="member-display-order">
              <span class="form-label">表示順</span>
              <input id="member-display-order" name="displayOrder" type="number" min="0" inputmode="numeric" placeholder="例: 10">
            </label>
          </div>
          <label for="member-started-reason">
            <span class="form-label">モルックを始めたきっかけ</span>
            <textarea id="member-started-reason" name="startedReason" rows="4"></textarea>
          </label>
          <label for="member-favorite-things">
            <span class="form-label">モルック以外の好きなこと</span>
            <textarea id="member-favorite-things" name="favoriteThings" rows="4"></textarea>
          </label>
          <label for="member-first-message">
            <span class="form-label">初参加者へのメッセージ</span>
            <textarea id="member-first-message" name="firstTimerMessage" rows="4"></textarea>
          </label>
          <label for="member-comment">
            <span class="form-label">ひとことコメント</span>
            <textarea id="member-comment" name="comment" rows="3"></textarea>
          </label>
          <label class="checkbox-line admin-checkbox">
            <input name="isPublished" type="checkbox">
            <span>公開する</span>
          </label>
          <div class="form-actions admin-actions">
            <button class="button button--primary" type="submit">メンバーを保存</button>
            <button class="button button--secondary" type="button" data-admin-cancel-edit hidden>編集をキャンセル</button>
          </div>
        </form>

        <div class="admin-card">
          <h2>登録済みメンバー</h2>
          <div class="admin-list" data-admin-members-list>
            <p class="admin-empty">メンバーを読み込んでいます。</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
