<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>管理画面ログイン | Molkkynist</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="../js/admin-login.js"></script>
  </head>
  <body class="admin-page">
    <main class="admin-shell admin-shell--centered">
      <section class="admin-card admin-card--narrow" aria-labelledby="login-title">
        <a class="brand" href="../index.html" aria-label="Molkkynist トップページ">
          <img class="brand__mark" src="../assets/images/logos/molkkynist-logo-mark.png" alt="" width="48" height="48">
          <span class="brand__name">Molkkynist</span>
        </a>
        <div class="admin-heading">
          <p class="section__label">Admin</p>
          <h1 id="login-title">管理画面ログイン</h1>
          <p>石井さん専用の更新画面です。Firebase Authentication に登録したメールアドレスでログインしてください。</p>
        </div>
        <form class="contact-form admin-form" data-admin-login>
          <label for="admin-email">
            <span class="form-label">メールアドレス</span>
            <input id="admin-email" name="email" type="email" autocomplete="email" required>
          </label>
          <label for="admin-password">
            <span class="form-label">パスワード</span>
            <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <p class="form-status" data-admin-status hidden></p>
          <div class="form-actions">
            <button class="button button--primary" type="submit">ログイン</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
